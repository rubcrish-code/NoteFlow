name: Source validation

on:
  pull_request:
    branches: [release/windows-hardening]
  push:
    branches: [release/windows-hardening]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows frontend, Rust and browser regression
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Scan source and history for secrets
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'gitleaks-8.30.1.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'noteflow-gitleaks'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'D29144DEFF3A68AA93CED33DDDF84B7FDC26070ADD4AA0F4513094C8332AFC4E') { throw 'Secret scanner checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          & "$tools/gitleaks.exe" dir . --redact=100 --max-archive-depth 3 --no-banner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$tools/gitleaks.exe" git . --redact=100 --max-archive-depth 3 --no-banner
          exit $LASTEXITCODE
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --offline=false
      - name: Install Rust tools
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Rust check
        working-directory: src-tauri
        run: cargo check --locked
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Install browser
        run: npx playwright install msedge
      - name: Full browser regression
        run: npm run test:browser
      - name: Tauri application build (no release publication)
        run: npm run tauri -- build --no-bundle
      - name: Diff check
        run: git -c core.safecrlf=false diff --check
